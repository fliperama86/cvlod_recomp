# N64Recomp config for Castlevania: Legacy of Darkness (ND4E)

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "overlays.txt"
symbols_file_path = "castlevania2.syms.toml"
rom_file_path = "resources/castlevania2_ni_extended.z64"

[patches]
# Stub out functions with unsupported instructions (cop0/TLB/cache/eret/trunc.l)
# or incorrect boundaries detected by splat
stubs = [
    # TLB mapping (mfc0/mtc0 EntryHi/Lo, tlbwi) - NOT in recompiler's ignored list
    "func_80017720",
    "func_80097730",
    "func_800A02F0",
    "func_800A4D40",
    # Exception handler / __osEnqueueAndYield - NOT in ignored list (different names)
    "func_80097AB0",
    "func_80097FE4",
    # trunc.l.d / trunc.l.s (MIPS III unsupported by this N64Recomp version)
    "func_800A6C20",
    "func_800A6C3C",
    # Branch to RSP IMEM / multi-register cop0
    "func_800AADA0",
    "func_800AADA8",
    # Boundary issue: its one jal targets the overlay_system window (0x801D26A0)
    # obj1B0_createModel is restored by tools/apply_patches.py (LOD_FIX_OBJ1B0_INIT)
    "obj1B0_createModel",
    # Former Tower of Sorcery boundary stubs are now generated and fixed by the post-processing chain.
    # Overlay functions with branches to unmapped addresses
    "map_ovl_42_func_802E8A80",
    "map_ovl_42_func_802E8A88",
    "map_ovl_42_func_802E8AAC",
    "map_ovl_42_func_802E8AD0",
    "map_ovl_42_func_802E8AF4",
]

ignored = []

# ni_ovl_242_func_0F000358 dispatches through a 7-entry jump table at 0x0E000FC8
# (the same NI file mapped at 0x0E). N64Recomp cannot see a table in another
# segment, so replace the table load + jr with equivalent branches on the
# index ($t3 = idx << 2): idx 0 -> 0x0F000568, idx 6 -> 0x0F000550,
# idx 1..5 -> 0x0F00055C. Indices >= 7 already branch to 0x0F000568 earlier.
[[patches.instruction]]
func = "ni_ovl_242_func_0F000358"
vram = 0x0F00053C
value = 0x24010018 # addiu $at, $zero, 0x18

[[patches.instruction]]
func = "ni_ovl_242_func_0F000358"
vram = 0x0F000540
value = 0x11600009 # beq $t3, $zero, 0x0F000568

[[patches.instruction]]
func = "ni_ovl_242_func_0F000358"
vram = 0x0F000544
value = 0x00000000 # nop

[[patches.instruction]]
func = "ni_ovl_242_func_0F000358"
vram = 0x0F000548
value = 0x15610004 # bne $t3, $at, 0x0F00055C

[[patches.instruction]]
func = "ni_ovl_242_func_0F000358"
vram = 0x0F00054C
value = 0x00000000 # nop
